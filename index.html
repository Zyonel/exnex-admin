<!DOCTYPE html>
<html>
<head>
  <title>Uploaded Receipts</title>
</head>
<body>

<h2>Uploaded Receipts</h2>
<div id="list"></div>

<script>
//fetch('/uploads-list')
fetch('https://exnex-moi9.onrender.com/uploads-list')

  .then(res => res.json())
  .then(files => {
    const list = document.getElementById('list');

    if (!files.length) {
      list.innerHTML = 'No uploads yet';
      return;
    }

    files.forEach(f => {
      if (f.endsWith('.pdf')) {
        list.innerHTML += `<a href="${f}" target="_blank">View PDF</a><br>`;
      } else {
        list.innerHTML += `<img src="${f}" width="250"><br>`;
      }
    });
  });
</script>

</body>
</html>
